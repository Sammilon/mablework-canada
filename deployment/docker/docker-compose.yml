version: '3.8'

services:
  # ==================================================
  # Core Platform Application Service
  # ==================================================
  app:
    container_name: mablework_app
    build:
      context: ../../
      dockerfile: deployment/docker/Dockerfile
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://db_user:secure_db_pass@mongodb:27017/mablework?authSource=admin
    depends_on:
      - mongodb
    volumes:
      # Persistent tracking for runtime system logs
      - app_logs:/usr/src/app/backend/logs
      # Persistent storage for uploaded worker IDs, resumes, and company files
      - uploads_ids:/usr/src/app/backend/uploads/ids
      - uploads_resumes:/usr/src/app/backend/uploads/resumes
      - uploads_company_docs:/usr/src/app/backend/uploads/company-docs
      - uploads_chat_files:/usr/src/app/backend/uploads/chat-files
    networks:
      - mablework_network

  # ==================================================
  # Isolated Database Engine Service
  # ==================================================
  mongodb:
    container_name: mablework_mongodb
    image: mongo:6.0-jammy
    restart: always
    environment:
      - MONGO_INITDB_ROOT_USERNAME=db_user
      - MONGO_INITDB_ROOT_PASSWORD=secure_db_pass
      - MONGO_INITDB_DATABASE=mablework
    volumes:
      - mongo_data:/data/db
    networks:
      - mablework_network

# ==================================================
# Storage Network & Persistent Volume Mapping
# ==================================================
networks:
  mablework_network:
    driver: bridge

volumes:
  mongo_data:
    driver: local
  app_logs:
    driver: local
  uploads_ids:
    driver: local
  uploads_resumes:
    driver: local
  uploads_company_docs:
    driver: local
  uploads_chat_files:
    driver: local
